schema_version = "1.4"
artifacts = ["/app/output/results.json", "/app/output/reproduce.py"]

[task]
name = "gri-design-bench/release-timing-attribution"
description = "Use paired virtual-patient replays to isolate within-day insulin release timing at matched daily doses."
authors = []
keywords = ["drug-delivery", "in-silico", "counterfactual", "mechanistic-analysis"]

[metadata]
domain = "life-sciences"
field = "medicine-and-health"
protocol = "release-timing-replay-v2"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
gpus = 0
network_mode = "no-network"

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
gpus = 0
network_mode = "no-network"
