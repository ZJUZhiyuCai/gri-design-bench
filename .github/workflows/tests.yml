name: Public reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install setuptools==80.10.2 wheel==0.48.0
          python -m pip install --no-build-isolation -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip install pytest==9.2.0
      - name: Check frozen runtime and public-only inputs
        run: |
          test ! -d private/sealed
          python -c 'from gri_bench.runner import verify_runtime_lock; verify_runtime_lock()'
          python -c 'from gri_bench.repeat_runner import verify_repeat_lock; verify_repeat_lock("repeat-20261111-r1")'
      - name: Verify physiology, scoring and submission boundary
        run: python -m pytest -q
